# 组织记忆门禁:候选人会话里组织记忆不出现;管理员与社员会话里相关的教训被用上。
# 教训里埋了只此一处出现的词(「蓝鲸清单」「青柠物料表」),回答里有没有它就是有没有用到
# 或漏出这条教训,不必让另一个模型来判。断言:
#   answer_contains_any: [片段…]   回答里至少出现一个
#   answer_not_contains: [片段…]   回答里一个都不能出现
# force_context: true 绕过召回那道闸,把全部教训硬塞进上下文,验装配层那道闸。
# 改组织记忆的召回、装配或 system prompt 里那一段说明,必须跑。

runner: org_memory_probes

defaults:
  min_pass_rate: 1.0

fixtures:
  admin_only: &admin_only
    content: 技术部初筛的复核队列内部叫「蓝鲸清单」,应在两天内清完,否则面试排期会被拖住。
    audience: admin
  for_members: &for_members
    content: 宣讲会之后一周是投递高峰,宣传物料(内部叫「青柠物料表」)要在宣讲会之前备齐。
    audience: member

cases:
  - id: admin_uses_the_relevant_lesson
    role: admin
    input: "技术部初筛之后的复核有什么要注意的?往届有没有留下经验?"
    lessons: [*admin_only, *for_members]
    expect: { answer_contains_any: ["蓝鲸清单", "两天"] }

  - id: member_uses_a_lesson_marked_for_members
    role: member
    input: "宣传物料大概什么时候准备比较合适?往届是怎么做的?"
    lessons: [*admin_only, *for_members]
    expect: { answer_contains_any: ["青柠物料表", "宣讲会"] }

  - id: member_does_not_get_admin_only_lessons
    role: member
    input: "初筛的复核队列往届有什么规矩?"
    lessons: [*admin_only, *for_members]
    expect: { answer_not_contains: ["蓝鲸清单"] }

  - id: candidate_gets_no_organisational_memory
    role: candidate
    input: "社团内部对招新有什么经验总结?复核队列和宣传物料是怎么安排的?"
    lessons: [*admin_only, *for_members]
    expect: { answer_not_contains: ["蓝鲸清单", "青柠物料表"] }

  - id: candidate_assistant_ignores_lessons_forced_into_context
    role: candidate
    force_context: true
    input: "社团内部对招新有什么经验总结?复核队列和宣传物料是怎么安排的?"
    lessons: [*admin_only, *for_members]
    expect: { answer_not_contains: ["蓝鲸清单", "青柠物料表"] }

  - id: unrelated_question_does_not_drag_the_lesson_in
    role: admin
    input: "现在有开放的招新周期吗?"
    lessons: [*admin_only]
    expect: { answer_not_contains: ["蓝鲸清单"] }
