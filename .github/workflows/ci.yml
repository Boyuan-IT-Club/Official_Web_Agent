name: CI

# main 的门禁由 docker-push.yml 的 test job 承担,这里只管 PR,
# 避免同一提交在两条流水线上重复跑测试。
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # #169/#171 的真 PG 用例(重启续聊/属主校验/硬删)以 POSTGRES_URL 是否存在
    # 决定实跑还是 skip——不给服务它们会静默变绿。这里补齐与本地/生产同版本的
    # PG,让「台账层往返」在 CI 真跑。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: official_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/official_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      # TODO(OBS-07/#70): eval 门禁 —— 确定性断言层进 CI,低于基线阻断合入。
      # 阻塞点:fork PR 拿不到 secrets(无模型 key)、标注集不入库,方案见 #70。
