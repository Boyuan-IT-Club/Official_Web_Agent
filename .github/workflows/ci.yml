name: CI

# main 的门禁由 docker-push.yml 的 test job 承担,这里只管 PR,
# 避免同一提交在两条流水线上重复跑测试。
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      # TODO(zewang): eval 门禁 —— 确定性断言层进 CI,低于基线阻断合入 - fork PR 拿不到 secrets 且标注集不入库,方案未定
